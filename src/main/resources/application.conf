# Конфигурация koog-chat-tool (HOCON).
# Каждое значение можно переопределить переменной окружения — синтаксис ${?VAR}
# (переменная не задана — используется значение по умолчанию).

ktor {
  deployment {
    port = 8080
    port = ${?PORT}
    host = "0.0.0.0"
  }
}

app {
  # Хранилище историй чатов: каталог, лимиты сообщений и размера тела запроса.
  storage {
    dir = "storage/chats"
    dir = ${?CHAT_STORAGE_DIR}
    maxMessagesPerChat = 500
    maxMessageLength = 100000       # символов в одном сообщении
    maxRequestBodyBytes = 5242880   # 5 МБ — защита от слишком больших тел
  }

  # Настройки LLM: OpenAI-совместимый провайдер, который обслуживается Koog.
  llm {
    provider = "openai-compatible"  # openai-compatible | deepseek | openrouter
    baseUrl = "https://api.openai.com"
    baseUrl = ${?LLM_BASE_URL}
    apiKey = ""
    apiKey = ${?LLM_API_KEY}
    model = "gpt-4.1"
    model = ${?LLM_MODEL}
    requestTimeoutMs = 120000
    requestTimeoutMs = ${?LLM_REQUEST_TIMEOUT_MS}
    exposeChatEndpoint = false      # POST /llm/chat — только для верификации/QA
    exposeChatEndpoint = ${?EXPOSE_LLM_CHAT}
  }

  # Каталог логов (сюда пишется logs/llm-requests.log — журнал запросов/ответов LLM).
  logging {
    dir = "logs"
    dir = ${?LOG_DIR}
  }
}
